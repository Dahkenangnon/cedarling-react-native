import groovy.json.JsonSlurper
import java.security.MessageDigest

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.cedarling'
version = '0.1.0'
def instrumentationAbi = providers.gradleProperty("cedarlingInstrumentationAbi").orNull
def supportedInstrumentationAbis = ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
if (instrumentationAbi != null && !supportedInstrumentationAbis.contains(instrumentationAbi)) {
  throw new GradleException(
    "Unsupported cedarlingInstrumentationAbi '${instrumentationAbi}'. " +
      "Expected one of: ${supportedInstrumentationAbis.join(', ')}"
  )
}

android {
  namespace "expo.modules.cedarling"
  defaultConfig {
    minSdk 24
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles "consumer-rules.pro"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    testInstrumentationRunnerArguments class: "expo.modules.cedarling.CedarlingNativeInstrumentedTest"
    if (instrumentationAbi != null) {
      ndk {
        abiFilters instrumentationAbi
      }
    }
  }
  lintOptions {
    abortOnError true
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  implementation("net.java.dev.jna:jna:5.19.1@aar")
  implementation("com.google.code.gson:gson:2.12.1")
  implementation(files("libs/rustls-platform-verifier-0.1.1.jar"))

  testImplementation("junit:junit:4.13.2")

  androidTestImplementation("androidx.test:core-ktx:1.6.1")
  androidTestImplementation("androidx.test.ext:junit-ktx:1.2.1")
  androidTestImplementation("androidx.test:runner:1.6.2")
}

def sha256 = { File input ->
  MessageDigest digest = MessageDigest.getInstance("SHA-256")
  input.withInputStream { stream ->
    byte[] buffer = new byte[8192]
    int read
    while ((read = stream.read(buffer)) != -1) {
      digest.update(buffer, 0, read)
    }
  }
  digest.digest().collect { String.format("%02x", it) }.join()
}

tasks.register("verifyCedarlingNativeArtifacts") {
  def provenanceFile = file("cedarling-native/UPSTREAM.json")
  inputs.file(provenanceFile)
  doLast {
    if (!provenanceFile.isFile()) {
      throw new GradleException("Missing Cedarling provenance: " + provenanceFile)
    }
    def pinnedRevision = file("cedarling-native/PINNED_REVISION").text.trim()
    def provenance = new JsonSlurper().parse(provenanceFile)
    if (provenance.revision != pinnedRevision) {
      throw new GradleException("Cedarling revision does not match the pinned v2.3.0 commit")
    }
    provenance.artifacts.each { artifact ->
      def artifactFile = file(artifact.path)
      if (!artifactFile.isFile()) {
        throw new GradleException("Missing Cedarling artifact: " + artifact.path)
      }
      def actual = sha256(artifactFile)
      if (actual != artifact.sha256) {
        throw new GradleException("Checksum mismatch for " + artifact.path)
      }
    }
  }
}

tasks.named("preBuild").configure {
  dependsOn("verifyCedarlingNativeArtifacts")
}
