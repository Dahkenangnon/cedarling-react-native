name: Regenerate iOS native artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regenerate-ios-artifacts
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Check out this repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out pinned Jans source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JanssenProject/jans
          ref: f7c6e34be6ac8d585a9d7b6f7a12921b440b495b
          path: _jans
          persist-credentials: false

      - name: Restore pinned Cargo sources
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: macos-26-arm64-rust-1.95.0-cargo-sources-f7c6e34be6ac8d585a9d7b6f7a12921b440b495b-v1

      - name: Install SHA-verified protoc
        run: |
          archive="$RUNNER_TEMP/protoc-31.1-osx-aarch_64.zip"
          destination="$RUNNER_TEMP/protoc-31.1"
          curl --fail --location --silent --show-error \
            https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-osx-aarch_64.zip \
            --output "$archive"
          echo "4aeea0a34b0992847b03a8489a8dbedf3746de01109b74cc2ce9b6888a901ed9  $archive" \
            | shasum -a 256 -c -
          mkdir -p "$destination"
          unzip -q "$archive" -d "$destination"
          chmod +x "$destination/bin/protoc"
          echo "$destination/bin" >> "$GITHUB_PATH"

      - name: Report reviewed toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          protoc --version
          sw_vers

      - name: Generate and verify exact-pin artifacts
        run: scripts/sync-cedarling-ios.sh _jans

      - name: Upload artifacts for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cedarling-ios-native-${{ github.sha }}-${{ github.run_id }}
          path: ios
          if-no-files-found: error
          retention-days: 7
