name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NODE_VERSION: 22.13.1

jobs:
  package:
    name: JavaScript and package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix example ci

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm --prefix example audit --audit-level=high

      - name: Lint, typecheck, test, and build
        run: |
          npm run lint
          npm run typecheck
          npm test -- --runInBand
          npm run build
          npm --prefix example run typecheck
          cd example
          npx expo config --type public >/dev/null

      - name: Verify deterministic fixture
        run: |
          npm run build:policy-fixture
          git diff --exit-code -- \
            example/assets/policy-store.cjar \
            android/src/androidTest/assets

      - name: Verify native pins and source artifacts
        run: |
          npm run verify:autolinking
          npm run verify:native-pins
          npm run verify:android-artifacts -- --native-only
          npm run verify:ios-artifacts -- --native-only

      - name: Verify Android and iOS npm payloads
        run: npm run verify:package

  android-build:
    name: Android JVM, lint, and release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix example ci

      - name: Generate a clean Android project
        working-directory: example
        run: npx expo prebuild --clean --platform android --no-install

      - name: Set up Java and Gradle cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/build.gradle
            example/android/**/*.gradle*

      - name: Run module JVM tests and Android lint
        working-directory: example/android
        env:
          NODE_ENV: test
        run: ./gradlew :cedarling-react-native:testDebugUnitTest :cedarling-react-native:lintDebug --stacktrace

      - name: Build release APK and AAB
        working-directory: example/android
        env:
          NODE_ENV: production
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Install verified Bundletool
        run: |
          mkdir -p "$RUNNER_TEMP/bundletool"
          curl --fail --location --silent --show-error \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool/bundletool-all-1.18.3.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool/bundletool-all-1.18.3.jar" \
            | sha256sum -c -
          echo "BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool/bundletool-all-1.18.3.jar" >> "$GITHUB_ENV"

      - name: Verify release native packaging
        run: npm run verify:android-artifacts

      - name: Upload release application artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-${{ github.sha }}
          path: |
            example/android/app/build/outputs/apk/release/*.apk
            example/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-reports-${{ github.sha }}
          path: |
            android/build/reports
            android/build/test-results
            example/android/app/build/reports
          if-no-files-found: ignore
          retention-days: 7

  android-runtime:
    name: Android real native runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix example ci

      - name: Generate a clean Android project
        working-directory: example
        run: npx expo prebuild --clean --platform android --no-install

      - name: Set up Java and Gradle cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/build.gradle
            example/android/**/*.gradle*

      - name: Run Cedarling on an API 36 x86_64 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb shell getprop ro.product.cpu.abilist
            adb shell getconf PAGE_SIZE
            cd example/android
            NODE_ENV=test ./gradlew :cedarling-react-native:connectedDebugAndroidTest -PcedarlingInstrumentationAbi=x86_64 -PreactNativeArchitectures=x86_64 --stacktrace || {
              adb logcat -d > "$RUNNER_TEMP/android-logcat.txt"
              exit 1
            }
            adb logcat -d > "$RUNNER_TEMP/android-logcat.txt"

      - name: Upload Android runtime reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-runtime-reports-${{ github.sha }}
          path: |
            android/build/reports/androidTests
            android/build/outputs/androidTest-results
            ${{ runner.temp }}/android-logcat.txt
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS native, simulator UI, and device link
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require reviewed Apple-silicon toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          sw_vers
          xcrun simctl list devices available

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Install locked JavaScript dependencies
        run: |
          npm ci
          npm --prefix example ci

      - name: Select an available iPhone simulator
        run: |
          simulator_json="$RUNNER_TEMP/available-simulators.json"
          xcrun simctl list devices available --json > "$simulator_json"
          SIMULATOR_JSON="$simulator_json" node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync(process.env.SIMULATOR_JSON, "utf8"));
            const device = Object.entries(data.devices)
              .filter(([runtime]) => runtime.includes(".iOS-"))
              .sort(([left], [right]) => right.localeCompare(left))
              .flatMap(([, devices]) => devices)
              .find((candidate) => candidate.isAvailable !== false && candidate.name.startsWith("iPhone"));
            if (!device) throw new Error("No available iPhone simulator was found");
            fs.appendFileSync(process.env.GITHUB_ENV, `IOS_SIMULATOR_UDID=${device.udid}\n`);
            console.log(`Selected ${device.name} (${device.udid})`);
          '

      - name: Verify exact-pin iOS artifacts on macOS
        run: npm run verify:ios-artifacts -- --native-only

      - name: Generate a clean iOS project
        working-directory: example
        run: npx expo prebuild --clean --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: |
          if [[ -f example/ios-lock/Podfile.lock ]]; then
            cp example/ios-lock/Podfile.lock example/ios/Podfile.lock
            pod install --project-directory=example/ios --deployment
          else
            echo "Bootstrapping the initial reviewed Podfile.lock"
            pod install --project-directory=example/ios
          fi

      - name: Upload generated Podfile lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-pod-lock-${{ github.sha }}
          path: example/ios/Podfile.lock
          if-no-files-found: error
          retention-days: 3

      - name: Configure discoverable native and UI test targets
        run: ruby scripts/configure-ios-tests.rb

      - name: Run native Swift tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace example/ios/CedarlingReactNativeExample.xcworkspace \
            -scheme CedarlingReactNativeExample-NativeTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/CedarlingDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/CedarlingNativeTests.xcresult" \
            -only-testing:CedarlingReactNativeExampleTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/ios-native-tests.log"

      - name: Run JavaScript-to-Rust simulator smoke test
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace example/ios/CedarlingReactNativeExample.xcworkspace \
            -scheme CedarlingReactNativeExample-UITests \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/CedarlingDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/CedarlingUITests.xcresult" \
            -only-testing:CedarlingReactNativeExampleUITests \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/ios-ui-tests.log"

      - name: Compile and link the device slice without signing
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace example/ios/CedarlingReactNativeExample.xcworkspace \
            -scheme CedarlingReactNativeExample \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/CedarlingDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee "$RUNNER_TEMP/ios-device-build.log"
          app_binary="$RUNNER_TEMP/CedarlingDerivedData/Build/Products/Release-iphoneos/CedarlingReactNativeExample.app/CedarlingReactNativeExample"
          test -f "$app_binary"
          file "$app_binary" | grep -q arm64
          otool -L "$app_binary" | tee "$RUNNER_TEMP/ios-device-dependencies.txt"
          if grep -E '^[[:space:]]+(/Users/|/home/)' "$RUNNER_TEMP/ios-device-dependencies.txt"; then
            echo "Device binary contains a machine-local dynamic dependency" >&2
            exit 1
          fi

      - name: Upload iOS test and build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/CedarlingNativeTests.xcresult
            ${{ runner.temp }}/CedarlingUITests.xcresult
            ${{ runner.temp }}/ios-native-tests.log
            ${{ runner.temp }}/ios-ui-tests.log
            ${{ runner.temp }}/ios-device-build.log
            ${{ runner.temp }}/ios-device-dependencies.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unsigned iOS device build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-unsigned-device-build-${{ github.sha }}
          path: ${{ runner.temp }}/CedarlingDerivedData/Build/Products/Release-iphoneos/CedarlingReactNativeExample.app
          if-no-files-found: error
          retention-days: 7
